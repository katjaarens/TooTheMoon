<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Stile & Schatten -->
    <style>
      .room-bg { fill: #0b0f19; }
      .wall { fill: none; stroke: rgba(255, 255, 255, 0.2); stroke-width: 4; stroke-linejoin: round; }
      .zone-text { fill: #94a3b8; font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; text-anchor: middle; }
      .table-circle { fill: rgba(255, 255, 255, 0.04); stroke: #f472b6; stroke-width: 2.5; }
      .table-rect { fill: rgba(255, 255, 255, 0.04); stroke: #f472b6; stroke-width: 2.5; rx: 6; }
      
      <!-- Sitzplätze / Stühle -->
      .seat { fill: #1e293b; stroke: #f472b6; stroke-width: 1.5; rx: 4; cursor: pointer; transition: all 0.2s; }
      .seat:hover { fill: #f472b6; }
      .seat-circle { fill: #1e293b; stroke: #f472b6; stroke-width: 1.5; cursor: pointer; }
      .seat-text { fill: #cbd5e1; font-family: 'Inter', sans-serif; font-size: 9px; text-anchor: middle; dominant-baseline: central; font-weight: bold; pointer-events: none; }
      
      <!-- Buffet & Bar -->
      .buffet-table { fill: rgba(56, 189, 248, 0.1); stroke: #38bdf8; stroke-width: 2; rx: 6; }
      .buffet-text { fill: #38bdf8; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; letter-spacing: 1px; }

      .label { fill: #ffffff; font-family: 'Playfair Display', serif; font-size: 14px; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
      .sub-label { fill: #94a3b8; font-family: 'Inter', sans-serif; font-size: 10px; text-anchor: middle; }
      .dancefloor { fill: rgba(244, 114, 182, 0.03); stroke: rgba(244, 114, 182, 0.25); stroke-dasharray: 6 6; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <!-- Raum Hintergrund -->
  <rect width="1000" height="650" class="room-bg" rx="16" />
  
  <!-- Wände des Saals -->
  <rect x="40" y="40" width="920" height="570" class="wall" rx="12" />

  <!-- ================= BEREICHE (Buffet & Tanzfläche) ================= -->

  <!-- Buffet-Bereich (Rechte Wand) -->
  <g transform="translate(830, 160)">
    <rect x="0" y="0" width="80" height="220" class="buffet-table" />
    <text x="40" y="110" class="buffet-text" transform="rotate(90, 40, 110)">BUFFET</text>
  </g>

  <!-- Bar / Eingang (Unten) -->
  <text x="500" y="585" class="zone-text">Eingang &amp; Bar-Bereich</text>
  <line x1="420" y1="565" x2="580" y2="565" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Tanzfläche (Zentrum) -->
  <rect x="360" y="240" width="280" height="170" class="dancefloor" />
  <text x="500" y="325" class="zone-text" font-size="14px">Tanzfläche</text>

  <!-- ================= TISCHE & EINZELNE SITZPLÄTZE ================= -->

  <!-- 1. Ehrentisch (Oben Quer mit Plätzen) -->
  <g transform="translate(500, 100)">
    <!-- Stühle Reihe Oben -->
    <g transform="translate(0, -28)">
      <rect x="-105" y="0" width="22" height="16" class="seat" /><text x="-94" y="8" class="seat-text">1</text>
      <rect x="-65" y="0" width="22" height="16" class="seat" /><text x="-54" y="8" class="seat-text">2</text>
      <rect x="-25" y="0" width="22" height="16" class="seat" /><text x="-14" y="8" class="seat-text">3</text>
      <rect x="15" y="0" width="22" height="16" class="seat" /><text x="26" y="8" class="seat-text">4</text>
      <rect x="55" y="0" width="22" height="16" class="seat" /><text x="66" y="8" class="seat-text">5</text>
      <rect x="95" y="0" width="22" height="16" class="seat" /><text x="106" y="8" class="seat-text">6</text>
    </g>
    <!-- Tischkörper -->
    <rect x="-120" y="-12" width="240" height="24" class="table-rect" />
    <text x="0" y="0" class="label">Ehrentisch</text>
  </g>

  <!-- 2. Tisch Links Oben (Rund mit 8 Plätzen) -->
  <g transform="translate(200, 160)">
    <!-- 8 Positionen im Kreis (Radius ~52px) -->
    <circle cx="0" cy="-52" r="11" class="seat-circle" /><text x="0" y="-52" class="seat-text">1</text>
    <circle cx="37" cy="-37" r="11" class="seat-circle" /><text x="37" y="-37" class="seat-text">2</text>
    <circle cx="52" cy="0" r="11" class="seat-circle" /><text x="52" y="0" class="seat-text">3</text>
    <circle cx="37" cy="37" r="11" class="seat-circle" /><text x="37" y="37" class="seat-text">4</text>
    <circle cx="0" cy="52" r="11" class="seat-circle" /><text x="0" y="52" class="seat-text">5</text>
    <circle cx="-37" cy="37" r="11" class="seat-circle" /><text x="-37" y="37" class="seat-text">6</text>
    <circle cx="-52" cy="0" r="11" class="seat-circle" /><text x="-52" y="0" class="seat-text">7</text>
    <circle cx="-37" cy="-37" r="11" class="seat-circle" /><text x="-37" y="-37" class="seat-text">8</text>
    <!-- Tisch -->
    <circle cx="0" cy="0" r="32" class="table-circle" />
    <text x="0" y="-3" class="label" font-size="12px">Tisch 1</text>
  </g>

  <!-- 3. Tisch Links Unten (Rund mit 8 Plätzen) -->
  <g transform="translate(200, 450)">
    <circle cx="0" cy="-52" r="11" class="seat-circle" /><text x="0" y="-52" class="seat-text">1</text>
    <circle cx="37" cy="-37" r="11" class="seat-circle" /><text x="37" y="-37" class="seat-text">2</text>
    <circle cx="52" cy="0" r="11" class="seat-circle" /><text x="52" y="0" class="seat-text">3</text>
    <circle cx="37" cy="37" r="11" class="seat-circle" /><text x="37" y="37" class="seat-text">4</text>
    <circle cx="0" cy="52" r="11" class="seat-circle" /><text x="0" y="52" class="seat-text">5</text>
    <circle cx="-37" cy="37" r="11" class="seat-circle" /><text x="-37" y="37" class="seat-text">6</text>
    <circle cx="-52" cy="0" r="11" class="seat-circle" /><text x="-52" y="0" class="seat-text">7</text>
    <circle cx="-37" cy="-37" r="11" class="seat-circle" /><text x="-37" y="-37" class="seat-text">8</text>
    <circle cx="0" cy="0" r="32" class="table-circle" />
    <text x="0" y="-3" class="label" font-size="12px">Tisch 2</text>
  </g>

  <!-- 4. Tisch Rechts Unten (Rund mit 8 Plätzen) -->
  <g transform="translate(680, 450)">
    <circle cx="0" cy="-52" r="11" class="seat-circle" /><text x="0" y="-52" class="seat-text">1</text>
    <circle cx="37" cy="-37" r="11" class="seat-circle" /><text x="37" y="-37" class="seat-text">2</text>
    <circle cx="52" cy="0" r="11" class="seat-circle" /><text x="52" y="0" class="seat-text">3</text>
    <circle cx="37" cy="37" r="11" class="seat-circle" /><text x="37" y="37" class="seat-text">4</text>
    <circle cx="0" cy="52" r="11" class="seat-circle" /><text x="0" y="52" class="seat-text">5</text>
    <circle cx="-37" cy="37" r="11" class="seat-circle" /><text x="-37" y="37" class="seat-text">6</text>
    <circle cx="-52" cy="0" r="11" class="seat-circle" /><text x="-52" y="0" class="seat-text">7</text>
    <circle cx="-37" cy="-37" r="11" class="seat-circle" /><text x="-37" y="-37" class="seat-text">8</text>
    <circle cx="0" cy="0" r="32" class="table-circle" />
    <text x="0" y="-3" class="label" font-size="12px">Tisch 3</text>
  </g>

</svg>
